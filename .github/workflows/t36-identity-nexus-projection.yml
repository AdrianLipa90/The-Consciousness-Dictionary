name: T36 Identity NEXUS Projection

on:
  push:
    branches:
      - feat/t36-identity-nexus-projection
  pull_request:
    paths:
      - 'src/consciousness_dictionary/query.py'
      - 'src/consciousness_dictionary/phasenav_native.py'
      - 'tests/test_identity_nexus_projection.py'
      - 'tests/test_phasenav.py'

jobs:
  projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run PhaseNav and external projection tests
        env:
          PYTHONPATH: src
        run: |
          python tests/test_phasenav.py
          python tests/test_identity_nexus_projection.py
